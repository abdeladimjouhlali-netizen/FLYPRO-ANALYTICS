# API Gateway (Nginx) – auth edge, routing, rate limit, logging
# Deploy as edge terminator in front of the SPA / LB.

limit_req_zone $binary_remote_addr zone=flypro_api:20m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=flypro_conn:10m;

map $http_authorization $auth_present {
    default 0;
    "~*^Bearer\s+.+" 1;
}

upstream gateway_backend {
    least_conn;
    server backend:8080 max_fails=3 fail_timeout=20s;
    keepalive 32;
}

upstream gateway_ai {
    least_conn;
    server ai-service:8000 max_fails=3 fail_timeout=20s;
    keepalive 16;
}

log_format gateway_json escape=json
  '{'
    '"timestamp":"$time_iso8601",'
    '"service":"api-gateway",'
    '"request_id":"$request_id",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"request_time":$request_time,'
    '"upstream":"$upstream_addr"'
  '}';

server {
    listen 443 ssl http2;
    server_name flypro.example.com;

    # ssl_certificate     /etc/nginx/tls/fullchain.pem;
    # ssl_certificate_key /etc/nginx/tls/privkey.pem;

    access_log /var/log/nginx/gateway.access.log gateway_json;
    client_max_body_size 55m;
    limit_conn flypro_conn 40;

    location /api/v1/auth/login {
        limit_req zone=flypro_api burst=20 nodelay;
        proxy_pass http://gateway_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req zone=flypro_api burst=80 nodelay;
        # Optional: reject unauthenticated API early (except public auth paths handled above)
        proxy_pass http://gateway_backend;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location /ai-api/ {
        limit_req zone=flypro_api burst=40 nodelay;
        proxy_pass http://gateway_ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
