# =============================================================================
# FlyPro Analytics – Secrets (PLACEHOLDERS)
# Replace values before production apply. Prefer External Secrets / Sealed Secrets.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: flypro-secrets
  namespace: flypro
  labels:
    app.kubernetes.io/part-of: flypro-analytics
type: Opaque
stringData:
  # Database (MySQL 8.4 – delivered backend). Brief Step 18 cites PostgreSQL;
  # runtime must match Spring Boot JDBC + Flyway (MySQL).
  MYSQL_DATABASE: flypro_analytics
  MYSQL_USER: flypro
  MYSQL_PASSWORD: "CHANGE_ME_DB_PASSWORD"
  MYSQL_ROOT_PASSWORD: "CHANGE_ME_ROOT_PASSWORD"
  DATABASE_USERNAME: flypro
  DATABASE_PASSWORD: "CHANGE_ME_DB_PASSWORD"

  # JWT HS256 (>= 32 chars)
  JWT_SECRET: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS"

  # Optional scrape token for Actuator Prometheus (ADMIN JWT)
  PROMETHEUS_BEARER_TOKEN: ""

  # HA infra (Phase 6 · Step 20)
  RABBITMQ_PASSWORD: "CHANGE_ME_RABBITMQ_PASSWORD"
  REDIS_PASSWORD: ""
  API_KEYS: ""
