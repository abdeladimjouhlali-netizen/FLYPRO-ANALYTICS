<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Critical Alert</title></head>
<body style="font-family:Segoe UI,Arial,sans-serif;background:#fff5f5;padding:24px;">
  <div style="max-width:640px;margin:0 auto;background:#fff;border-left:6px solid #b91c1c;padding:24px;">
    <h2 style="color:#b91c1c;margin-top:0;">CRITICAL ALERT</h2>

    <p style="font-size:12px;color:#6b7280;">Investigate immediately in FlyPro Analytics.</p>
  </div>
</body>
</html>
