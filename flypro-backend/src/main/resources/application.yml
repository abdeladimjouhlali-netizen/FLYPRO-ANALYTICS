# =============================================================================
# FlyPro Analytics – application.yml (configuration commune)
# Secrets via variables d'environnement uniquement.
# =============================================================================

spring:
  application:
    name: flypro-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: flypro-hikari
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB
  cache:
    type: caffeine
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
  thymeleaf:
    check-template-location: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha

flypro:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://localhost:3000}
  security:
    jwt-secret: ${JWT_SECRET:}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    issuer: ${JWT_ISSUER:flypro-analytics}
    swagger-enabled: ${SPRINGDOC_ENABLED:true}
    # false only in application-dev.yml for local bypass
    auth-enabled: ${FLYPRO_AUTH_ENABLED:true}
    dev-bypass-username: ${FLYPRO_DEV_BYPASS_USERNAME:admin}
    rate-limit:
      max-requests: ${AUTH_RATE_LIMIT_MAX:30}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
    brute-force:
      max-attempts: ${AUTH_BRUTE_FORCE_MAX:5}
      lock-seconds: ${AUTH_BRUTE_FORCE_LOCK_SECONDS:300}
    api-key:
      enabled: ${API_KEY_ENABLED:false}
      keys: ${API_KEYS:}
      protected-prefixes: ${API_KEY_PROTECTED_PREFIXES:/actuator/prometheus}
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@flypro.local}
  reports:
    scheduler-enabled: ${REPORT_SCHEDULER_ENABLED:true}
    default-recipient: ${REPORT_DEFAULT_RECIPIENT:admin@flypro.local}
  redis:
    enabled: ${REDIS_ENABLED:false}
  rabbitmq:
    enabled: ${RABBITMQ_ENABLED:false}
  async:
    core-pool-size: ${ASYNC_CORE_POOL_SIZE:4}
    max-pool-size: ${ASYNC_MAX_POOL_SIZE:16}
    queue-capacity: ${ASYNC_QUEUE_CAPACITY:500}

resilience4j:
  circuitbreaker:
    instances:
      aiService:
        registerHealthIndicator: true
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 3s
  retry:
    instances:
      aiService:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
  bulkhead:
    instances:
      aiService:
        maxConcurrentCalls: 20
        maxWaitDuration: 500ms
    thread-pool-instances:
      aiService:
        coreThreadPoolSize: 4
        maxThreadPoolSize: 8
        queueCapacity: 50
  ratelimiter:
    instances:
      aiService:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
        timeoutDuration: 0
  timelimiter:
    instances:
      aiService:
        timeoutDuration: 5s
        cancelRunningFuture: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    mail:
      enabled: false
    circuitbreakers:
      enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  observations:
    key-values:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

info:
  app:
    name: FlyPro Analytics Backend
    description: Intelligent Badge Access Management Platform
    version: 1.0.0

logging:
  level:
    root: INFO
    com.flypro.analytics: INFO
    io.github.resilience4j: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:}
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 14
