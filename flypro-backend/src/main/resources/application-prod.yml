# =============================================================================
# FlyPro Analytics – application-prod.yml
# =============================================================================

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
  jpa:
    show-sql: false
  flyway:
    baseline-on-migrate: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

flypro:
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    swagger-enabled: false
    api-key:
      enabled: ${API_KEY_ENABLED:false}
      keys: ${API_KEYS:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  redis:
    enabled: ${REDIS_ENABLED:false}
  rabbitmq:
    enabled: ${RABBITMQ_ENABLED:false}

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
  health:
    # SMTP optionnel en conteneur (pas de MailHog) — évite /actuator/health = 503
    mail:
      enabled: false
    circuitbreakers:
      enabled: false

logging:
  level:
    root: WARN
    com.flypro.analytics: INFO
  file:
    name: ${LOG_FILE:/var/log/flypro/backend.log}
