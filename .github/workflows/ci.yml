name: FlyPro Analytics CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: flypro-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flypro-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit & integration tests
        run: mvn -B test
      - name: Package
        run: mvn -B -DskipTests package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: flypro-backend-jar
          path: flypro-backend/target/*.jar
          if-no-files-found: error

  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flypro-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: flypro-frontend/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
        env:
          VITE_API_BASE_URL: ""
          VITE_AI_BASE_URL: "/ai-api"

  ai-service:
    name: AI Service (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flypro-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flypro-ai/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pytest
        run: pytest

  docker-images:
    name: Docker build & smoke startup
    runs-on: ubuntu-latest
    needs: [backend, frontend, ai-service]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env file
        run: |
          cp .env.example .env
          sed -i 's/change-me-db-password/ci-db-pass-123/g' .env
          sed -i 's/change-me-root-password/ci-root-pass-123/g' .env
          sed -i 's/change-me-to-a-long-random-secret-at-least-32-chars/ci-jwt-secret-must-be-long-enough-32b/g' .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for healthy services
        run: |
          chmod +x scripts/wait-for-healthy.sh
          ./scripts/wait-for-healthy.sh

      - name: API connectivity smoke tests
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -n 400

      - name: Tear down
        if: always()
        run: docker compose down -v
